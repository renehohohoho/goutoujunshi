<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141414">
    <title>Master Dog</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Relationship Strategist</p>
          <h1>Master Dog</h1>
        </div>
        <button id="settingsButton" class="icon-button" type="button" aria-label="設定">⚙</button>
      </header>

      <section id="settings" class="settings" hidden>
        <label>
          私人 access token
          <input id="tokenInput" type="password" autocomplete="current-password" placeholder="部署時設定的 token">
        </label>
        <button id="saveTokenButton" type="button">儲存</button>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="貼聊天內容，或直接說現在卡在哪裡"></textarea>
        <button id="sendButton" type="submit">送出</button>
      </form>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>

name: 知識與內容建議
description: 補充來源、場景、話術或包容性改進
title: "[Content] "
labels: ["content"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 內容類型
      options:
        - 研究或來源
        - 法律與安全
        - 關係場景
        - 話術與溝通
        - LGBTQ+與多元關係
        - 其他
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議內容
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 來源或實踐依據
      description: 如有，請優先提供原始研究或權威來源。

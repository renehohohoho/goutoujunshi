name: 問題報告
description: 報告錯誤、斷鏈、錯誤建議或安全邊界問題
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 請勿提交真實姓名、聯繫方式、私密聊天或其他可識別個人的信息。
  - type: textarea
    id: scenario
    attributes:
      label: 匿名化場景
      description: 使用虛構代號描述觸發問題的輸入。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際行為
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期行為
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Codex或模型版本（如已知）
